name: publish-apk-3
on:
  push:
    paths:
      - .github/workflows/publish-apk-3.yml
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -o stage_presets_arm64_debug.apk "https://tmpfiles.org/dl/1790472575.05d751beb38cb751/w2w9pCyV3e9c/stage_presets_arm64_debug.apk"
          echo "2f1cedaf52f303c41817a7b0a355f625fbaad0b013056555fb8a80366a98ef1c  stage_presets_arm64_debug.apk" | sha256sum -c -
          gh release create mvp-debug-apk-3 --repo owen307/stage-presets-apk --latest --title "Stage Presets arm64 debug APK 3" --notes "Arm64 debug APK for show-day controls. SHA-256 2f1cedaf52f303c41817a7b0a355f625fbaad0b013056555fb8a80366a98ef1c. Debug keystore CN=Android Debug." stage_presets_arm64_debug.apk
