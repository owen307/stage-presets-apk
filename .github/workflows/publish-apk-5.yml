name: publish-apk-5
on:
  push:
    paths:
      - .github/workflows/publish-apk-5.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o stage_presets_arm64_debug.apk "https://tmpfiles.org/dl/1790526505.5c39619a4c4cc282/wmwmpuOQgI7S/stage_presets_arm64_debug.apk"
          echo "e217070d43f2abca8d0ff530feb95ddfb336c0b0c64d7f88d23ed601bd57a171  stage_presets_arm64_debug.apk" | sha256sum -c
          gh release create mvp-debug-apk-5 --repo owen307/stage-presets-apk --latest --title "Stage Presets arm64 debug APK 5" --notes "ProPresenter playlist parser fix. SHA-256 e217070d43f2abca8d0ff530feb95ddfb336c0b0c64d7f88d23ed601bd57a171." stage_presets_arm64_debug.apk
